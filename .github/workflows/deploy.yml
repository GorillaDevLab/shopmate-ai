name: Deploy Tencent Cloud

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# 同一时间只允许一个部署在服务器上构建：两个 PR 相隔几秒合并时，
# 并发的 next build 会互相打断，留下不完整的构建产物。后来的部署排队等待。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Tencent Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            # 任何一步失败都立即停止，不再用失败的构建重启线上服务。
            set -eu

            cd ~/shopmate-ai

            # 只部署本次成功 CI 验证的提交。
            expected_sha="${{ github.event.workflow_run.head_sha }}"
            git fetch origin main

            if [ "$(git rev-parse origin/main)" != "$expected_sha" ]; then
              echo "Skip stale deployment: main has moved"
              exit 0
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "STOP: production worktree has local changes" >&2
              exit 1
            fi

            git checkout main
            git reset --hard "$expected_sha"

            pnpm install --frozen-lockfile

            # Runtime 使用 DATABASE_URL；迁移使用独立的 provisioning identity。
            set -a
            . ./.env
            set +a
            : "${DATABASE_URL:?根目录 .env 缺少 DATABASE_URL}"
            : "${MIGRATION_DATABASE_URL:?根目录 .env 缺少 MIGRATION_DATABASE_URL}"
            DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm --filter @shopmate/database prisma:migrate:deploy

            pnpm build

            pm2 restart shopmate-api
            pm2 restart shopmate-web
            pm2 save

            # 重启后确认 API 真正起来，失败时让这次部署显示为失败。
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3001/api/v1/health; then
                echo "API 健康检查通过"
                exit 0
              fi
              sleep 2
            done
            echo "API 健康检查失败，最近日志：" >&2
            pm2 logs shopmate-api --lines 80 --nostream >&2 || true
            exit 1
